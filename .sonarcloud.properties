# ============================================================================
# SonarCloud AUTOMATIC analysis configuration
# ============================================================================
# Automatic analysis reads THIS file — not sonar-project.properties (which is
# only honored by CI-triggered sonar-scanner runs; keep both in sync).
# Supported keys here are limited to scope/coverage exclusions.
# ============================================================================

sonar.exclusions=\
  **/.idea/**,\
  **/.git/**,\
  **/vendor/**,\
  **/tmp/**,\
  **/log/**,\
  **/storage/**,\
  **/node_modules/**,\
  **/.bundle/**,\
  **/coverage/**,\
  **/*.lock,\
  **/Gemfile.lock,\
  **/*.xls,\
  **/*.xlsx,\
  **/*.csv,\
  **/*.sqlite3,\
  **/*.pdf,\
  **/*.zip,\
  **/*.docx,\
  **/*.ris.txt,\
  **/*.nbib,\
  **/*.xml,\
  **/*.md,\
  **/docs/**,\
  **/public/*.html,\
  **/lib/*.html,\
  **/startstop.html,\
  **/lib/diseases.json,\
  **/lib/drugs.json,\
  **/lib/drug_classes.json,\
  **/lib/drugs_json_cleaned.json,\
  **/lib/atc.json,\
  **/lib/atc_complete.json,\
  **/lib/pdf_raw_text.json,\
  **/lib/pdf_raw_text.txt,\
  **/lib/seponering_data.json,\
  **/lib/seponeringslisten_text.json,\
  **/lib/stoppstart_section_mapping.json,\
  **/lib/Antikolinerge.json,\
  **/lib/startstop_debug.json,\
  **/Zotero2Mendeley/**

# Copy-paste detection exclusions: vendored j2xml coverage-merge scripts share
# Clover-XML walking boilerplate by design; one-off Zotero migration scripts
# are iterations of the same converter.
sonar.cpd.exclusions=\
  **/merge-clover.php,\
  **/merge-coverage.php,\
  **/Zotero2Mendeley/**
