# ============================================================================
# SonarQube / SonarScanner configuration for the tools monorepo
# ============================================================================
# Run with:  sonar-scanner
# Server/token via env or CLI:
#   sonar-scanner -Dsonar.host.url=https://your-sonar-host -Dsonar.token=<token>
# ============================================================================

sonar.projectKey=gundestrup_tools
sonar.projectName=tools
sonar.organization=gundestrup
sonar.projectVersion=1.0

# Scan the whole repo; the exclusions below trim it to real source code
sonar.sources=.
sonar.sourceEncoding=UTF-8

# ----------------------------------------------------------------------------
# Exclusions (mirrors .semgrepignore)
# ----------------------------------------------------------------------------

# Version control / editor / OS noise
sonar.exclusions=\
  **/.idea/**,\
  **/.git/**,\
  **/vendor/**,\
  **/tmp/**,\
  **/log/**,\
  **/storage/**,\
  **/node_modules/**,\
  **/.bundle/**,\
  **/coverage/**,\
  **/*.lock,\
  **/Gemfile.lock,\
  **/*.xls,\
  **/*.xlsx,\
  **/*.csv,\
  **/*.sqlite3,\
  **/*.pdf,\
  **/*.zip,\
  **/*.docx,\
  **/*.ris.txt,\
  **/*.nbib,\
  **/*.xml,\
  **/*.md,\
  **/docs/**,\
  **/public/*.html,\
  **/lib/*.html,\
  **/startstop.html,\
  **/lib/diseases.json,\
  **/lib/drugs.json,\
  **/lib/drug_classes.json,\
  **/lib/drugs_json_cleaned.json,\
  **/lib/atc.json,\
  **/lib/atc_complete.json,\
  **/lib/pdf_raw_text.json,\
  **/lib/pdf_raw_text.txt,\
  **/lib/seponering_data.json,\
  **/lib/seponeringslisten_text.json,\
  **/lib/stoppstart_section_mapping.json,\
  **/lib/Antikolinerge.json,\
  **/lib/startstop_debug.json

# ----------------------------------------------------------------------------
# Tests (none exist yet; keep patterns for when they are added)
# ----------------------------------------------------------------------------
sonar.test.inclusions=**/test/**,**/spec/**,**/tests/**
sonar.test.exclusions=**/spec/fixtures/**,**/test/fixtures/**

# ----------------------------------------------------------------------------
# Ruby language settings
# ----------------------------------------------------------------------------
# SonarQube's built-in Ruby analyzer (sonar-ruby) picks up *.rb automatically.
# Thresholds aligned with the defaults so the scan matches local RuboCop runs.
